<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromoHub's - As Melhores Ofertas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
  <link rel="shortcut icon" href="./favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
  <link rel="manifest" href="./favicon/site.webmanifest" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      max-height: 3em;
      overflow: hidden;
    }

    body {
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Cabeçalho (Header) -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-4">

        <!-- Logo -->
        <a href="./index.html" class="flex items-center gap-2">
          <h1 class="text-2xl text-brand-600 font-bold tracking-tight">Promo<span class="bg-brand-600 text-white ms-1 px-1 rounded">Hub's</span></h1>
        </a>

        <!-- Barra de Pesquisa -->
        <div class="w-full sm:w-96 relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input type="text" id="searchInput"
            class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-sm transition-colors"
            placeholder="Buscar promoções, celulares, notebooks...">
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

    <div class="mb-6 flex justify-between items-end">
      <h2 class="text-xl font-semibold text-slate-700">Promoções Recentes</h2>
      <span id="resultsCount" class="text-sm text-slate-500 font-medium">Carregando...</span>
    </div>

    <!-- Grid de Produtos -->
    <div id="promoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Os cards serão injetados aqui via JavaScript -->
    </div>

    <!-- Estado Vazio (quando pesquisa não acha nada) -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
      <div class="bg-slate-100 p-4 rounded-full mb-4">
        <i data-lucide="search-x" class="w-12 h-12 text-slate-400"></i>
      </div>
      <h3 class="text-lg font-medium text-slate-900">Nenhuma promoção encontrada</h3>
      <p class="text-slate-500 mt-1">Tente pesquisar com outras palavras-chave.</p>
    </div>

  </main>

  <!-- Rodapé -->
  <footer class="bg-white border-t border-slate-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 py-6 text-center text-slate-500 text-sm">
      &copy; 2026 PromoHub's. Todos os direitos reservados.
    </div>
  </footer>

  <!-- Lógica da Aplicação -->
  <script>
    // Inicializa os ícones do Lucide
    lucide.createIcons();

    let promocoesData = [];

    async function carregarPromocoes() {
      try {
        const response = await fetch('../data/promocoes.json');

        if (!response.ok) {
          throw new Error('Erro ao carregar JSON');
        }

        promocoesData = await response.json();

        renderPromocoes(promocoesData);

      } catch (erro) {
        console.error('Erro:', erro);
        resultsCount.textContent = 'Erro ao carregar promoções';
      }
    }

    const grid = document.getElementById('promoGrid');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const resultsCount = document.getElementById('resultsCount');

    // Trata o caminho da imagem (trocando \ por /)
    function formatImagePath(path) {
      if (!path) return '';
      return '../' + path.replace(/\\/g, '/');
    }

    // Renderiza os cards de promoções
    function renderPromocoes(itens) {
      grid.innerHTML = '';
      resultsCount.textContent = `${itens.length} promoções encontradas`;

      if (itens.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      grid.classList.remove('hidden');
      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      const html = itens.map(item => {

        // Formata o preço à vista
        let priceHtml = '';
        if (item.preco) {
          priceHtml = `
            <div class="text-xl font-bold text-emerald-600">
              R$ ${item.preco}
            </div>
          `;
        }

        // Formata o preço parcelado (apenas se for diferente do preço à vista)
        let parceladoHtml = '';
        if (item.preco_parcelado && item.preco !== item.preco_parcelado) {
          parceladoHtml = `
            <div class="text-xs text-slate-500 mt-1">
              ou R$ ${item.preco_parcelado} parcelado
            </div>
          `;
        }

        // Formata os cupons / eventos (quando não tem preço, mas tem cupom/moeda)
        if (!item.preco && !item.preco_parcelado) {
          priceHtml = `
            <div class="text-md font-bold text-brand-600 flex items-center gap-1">
              <i data-lucide="zap" class="w-4 h-4"></i>
              Oferta Especial
            </div>
          `;
        }

        // Formata o selo de cupom
        let cupomHtml = '';
        if (item.valor_cupom) {
          let text = `Cupom de R$ ${item.valor_cupom} OFF`;
          if (item.limite_minimo) {
            text += ` (acima de R$ ${item.limite_minimo})`;
          }
          cupomHtml = `
            <div class="mt-3 flex items-center gap-2 bg-orange-50 text-orange-600 border border-orange-200 text-xs px-2 py-1.5 rounded-md font-medium">
              <i data-lucide="ticket" class="w-4 h-4"></i>
              ${text}
            </div>
          `;
        }

        let cuponsHtml = '';
        if (item.codigos_cupom && item.codigos_cupom.length > 0) {
          cuponsHtml = `
            <div class="mt-3 bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-700 text-xs">
              <div class="flex flex-wrap gap-2">
                <div class="font-medium text-slate-800">Cupons</div>
                ${item.codigos_cupom.map(code => `
                  <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 text-slate-600">
                    ${code}
                  </span>
                `).join('')}
              </div>
            </div>
          `;
        }

        const imagePath = formatImagePath(item.imagem);
        const placeholder = `https://placehold.co/400x300/f1f5f9/94a3b8?text=Imagem\\nIndisponível`;

        return `
          <article class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow duration-300">
            <!-- Imagem -->
            <div class="aspect-[4/3] bg-slate-100 relative overflow-hidden flex-shrink-0">
              <img
                src="${imagePath}" 
                alt="${item.nome}" 
                onerror="this.onerror=null; this.src='${placeholder}';"
                class="w-full h-full object-contain p-2 mix-blend-multiply"
              />
            </div>

            <!-- Detalhes -->
            <div class="p-4 flex flex-col flex-grow">
              <!-- Título -->
              <h3 class="font-medium text-slate-800 text-sm md:text-base line-clamp-4 mb-3 flex-grow" title="${item.nome}">
                ${item.nome}
              </h3>

              <!-- Área de Preço -->
              <div class="mt-auto">
                ${priceHtml}
                ${parceladoHtml}
                ${cupomHtml}
                ${cuponsHtml}
              </div>

              <!-- Botão -->
              <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                class="mt-4 w-full flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white py-2 px-4 rounded-lg text-sm font-medium transition-colors">
                Pegar Promoção
                <i data-lucide="external-link" class="w-4 h-4"></i>
              </a>
            </div>
          </article>
        `;
      }).join('');

      grid.innerHTML = html;
      lucide.createIcons();
    }

    // Filtro de pesquisa em tempo real
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = promocoesData.filter(item =>
        item.nome.toLowerCase().includes(query)
      );
      renderPromocoes(filtered);
    });

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      carregarPromocoes();
    });

  </script>
</body>

</html>
